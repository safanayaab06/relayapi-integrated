services:
  db:
    image: postgres:16-alpine
    container_name: relayapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: apinova
      POSTGRES_USER: apinova
      POSTGRES_PASSWORD: apinova_dev_password
    ports:
      - "5432:5432"
    volumes:
      - relayapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apinova -d apinova"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  relayapi_pgdata:
